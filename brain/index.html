<h1 class="brain-title">mainak's brain</h1>

    class="brain-full"
    src="../static/models/brain-full.glb"

    shadow-intensity="0"

<div class="brain-controls">
  <button id="btn-rotate" class="ctl-btn" type="button">[ stop rotation ]</button>

  <button id="btn-right" class="ctl-btn" type="button">[ right hemisphere ]</button>
